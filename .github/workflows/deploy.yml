name: Deploy to GitHub Pages

# Builds the static export and publishes it to GitHub Pages on every push to
# main. The production site is served at the custom domain wearein.in (see
# public/CNAME) with no basePath. A fork deploying to <user>.github.io/<repo>
# sets the repository variable BASE_PATH (e.g. "/WAIN"); the build then
# prefixes routes and assets, and drops the CNAME so the fork doesn't claim the
# custom domain. Sitemap, robots and llms.txt always describe wearein.in.

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Least-privilege token the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Sub-path deploys only (forks). Unset for wearein.in.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
          # A repository *variable*, not a secret: NEXT_PUBLIC_* values are
          # inlined into the JS bundle at build time, so this URL is public
          # either way. Unset until the diagnosis Worker is deployed — the site
          # then falls back to its own local read (see worker/README.md).
          NEXT_PUBLIC_DIAGNOSIS_API: ${{ vars.DIAGNOSIS_API }}
          # Same Worker, its /contact route. Leave unset to reuse
          # DIAGNOSIS_API. Setting either makes the contact form use the Worker
          # in preference to Web3Forms below.
          NEXT_PUBLIC_CONTACT_API: ${{ vars.CONTACT_API }}
          # How the contact form sends by default: a Web3Forms access key,
          # registered to hello@wearein.in. Public by design (see the note
          # above) — a repository *variable*, not a secret. With this and the
          # Worker both unset, the form says plainly that nothing was sent and
          # offers a prefilled mailto: instead.
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}

      - name: Ensure Jekyll is bypassed
        run: touch ./out/.nojekyll

      - name: Drop CNAME on sub-path deploys
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
        run: if [ -n "$NEXT_PUBLIC_BASE_PATH" ]; then rm -f out/CNAME; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
