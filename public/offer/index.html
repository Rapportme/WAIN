<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Offer letter · WAIN Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Caveat:wght@600&display=swap">
<style>
  :root { --navy:#1a2138; --teal:#1d9aa6; --gold:#f4b22d; --cream:#f6f2e8; --line:#e4dfd2; --muted:#6b7280; --green:#16a34a; --red:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--navy); font-family:'Poppins', -apple-system, 'Segoe UI', sans-serif; }
  .top { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; gap:12px; }
  .top img { width:44px; }
  .top .t1 { font-size:11px; font-weight:600; letter-spacing:.6px; color:var(--teal); text-transform:uppercase; }
  .top .t2 { font-size:16px; font-weight:700; line-height:1.2; }
  main { max-width:860px; margin:0 auto; padding:18px 16px 60px; }
  .cards { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin-bottom:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; }
  .card .k { font-size:10.5px; font-weight:600; letter-spacing:.5px; color:var(--muted); text-transform:uppercase; }
  .card .v { font-size:17px; font-weight:700; margin-top:2px; }
  .pages { display:flex; flex-direction:column; gap:14px; align-items:center; }
  .pagewrap { width:100%; overflow:hidden; box-shadow:0 6px 24px rgba(26,33,56,.12); border-radius:4px; background:#fdfbf6; }
  .pagewrap .ol-page { transform-origin:top left; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:18px; }
  .panel h2 { margin:0 0 4px; font-size:18px; }
  .muted { color:var(--muted); font-size:13px; }
  label.chk { display:flex; gap:10px; align-items:flex-start; font-size:14px; margin:14px 0; cursor:pointer; }
  label.chk input { margin-top:3px; width:18px; height:18px; }
  .field { margin:10px 0; }
  .field label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
  input[type=text] { width:100%; padding:12px 14px; border:1px solid #cfc8b8; border-radius:10px; font:inherit; font-size:15px; background:#fff; }
  input.otp { letter-spacing:8px; text-align:center; font-size:22px; font-weight:700; }
  button.btn { width:100%; padding:14px; border:none; border-radius:10px; font:inherit; font-size:15px; font-weight:700; cursor:pointer; background:var(--teal); color:#fff; margin-top:6px; }
  button.btn.green { background:var(--green); }
  button.btn.ghost { background:#fff; color:var(--navy); border:1px solid var(--line); }
  button.btn:disabled { opacity:.5; cursor:not-allowed; }
  .err { color:var(--red); font-size:13px; margin-top:8px; min-height:18px; }
  .done { text-align:center; padding:26px 18px; }
  .done .tick { width:56px; height:56px; border-radius:50%; background:var(--green); color:#fff; font-size:30px; line-height:56px; margin:0 auto 10px; }
  .center { min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; }
  .link { background:none; border:none; color:var(--teal); font:inherit; font-weight:600; cursor:pointer; padding:0; text-decoration:underline; }
  @media (max-width:640px) { .cards { grid-template-columns:1fr 1fr; } .cards .card:last-child { grid-column:1 / -1; } }
</style>
</head>

function olIcon(k) { return '<img alt="" src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(OL_ICON[k]) + '">'; }
function olEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function olInline(s) { return olEsc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function olOrdinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function olLongDate(iso) {
  if (!iso) return '';
  const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
  const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  return olOrdinal(d) + ' ' + months[m - 1] + ' ' + y;
}
function olRupees(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); }
function olWords(num) {
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = n => n < 20 ? ones[n] : tens[Math.floor(n / 10)] + (n % 10 ? '-' + ones[n % 10] : '');
  const three = n => (n >= 100 ? ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' and ' : '') : '') + (n % 100 ? two(n % 100) : '');
  let n = Math.floor(Number(num) || 0); if (!n) return 'Zero';
  const parts = [];
  const cr = Math.floor(n / 1e7); n %= 1e7; const lk = Math.floor(n / 1e5); n %= 1e5; const th = Math.floor(n / 1000); n %= 1000;
  if (cr) parts.push(two(cr) + ' Crore'); if (lk) parts.push(two(lk) + ' Lakh'); if (th) parts.push(two(th) + ' Thousand'); if (n) parts.push(three(n));
  return parts.join(' ');
}

// "## Heading" lines and paragraphs separated by blank lines; **bold** inline
function olBlocks(text) {
  const out = [];
  String(text || '').replace(/\r/g, '').split(/\n\s*\n/).forEach(chunk => {
    const lines = chunk.split('\n');
    let para = [];
    const flush = () => { if (para.length) { out.push('<p>' + para.map(olInline).join('<br>') + '</p>'); para = []; } };
    lines.forEach(l => {
      if (/^##\s+/.test(l.trim())) { flush(); out.push('<h3>' + olInline(l.trim().replace(/^##\s+/, '')) + '</h3>'); }
      else if (l.trim()) para.push(l.trim());
    });
    flush();
  });
  return out;
}

// o = { ref_no, candidate_name, candidate_address, offer_date, letter_text, status, signed_at, signer_name, signer_phone_hint, letter_hash }
function olBuildPages(o, mount) {
  if (!document.querySelector('#olStyles')) { const st = document.createElement('style'); st.id = 'olStyles'; st.textContent = OL_CSS; document.head.appendChild(st); }
  mount.innerHTML = '';
  const signed = o.status === 'signed' && o.signed_at;
  const signedWhen = signed ? new Date(o.signed_at) : null;
  const signedLabel = signedWhen ? signedWhen.toLocaleString('en-GB', { timeZone: 'Asia/Kolkata', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }) + ' IST' : '';
  const blocks = [];
  blocks.push('<div class="ol-title">Job Offer Letter</div>');
  blocks.push(`<div class="ol-meta"><div>${olEsc(olLongDate(o.offer_date))}</div><div style="margin-top:12px;">${olEsc(o.candidate_name)}</div>${o.candidate_address ? `<div class="ol-addrline">${olEsc(o.candidate_address).replace(/\n/g, '<br>')}</div>` : ''}</div>`);
  olBlocks(o.letter_text).forEach(b => blocks.push(b));
  blocks.push(`<div class="ol-sign">Regards,<img src="${OL_ASSETS.sig}" alt="signature"><strong>Divine Abraham,<br>CEO - WAIN Collective LLP</strong></div>`);
  blocks.push(`<div class="ol-accept">
      <p style="margin:0 0 10px;">I, <span class="ol-fill">${signed ? olEsc(o.signer_name) : '&nbsp;'}</span>, hereby accept the offer with the mentioned terms.</p>
      <p style="margin:0 0 6px;">Name: <span class="ol-fill">${signed ? olEsc(o.signer_name) : '&nbsp;'}</span></p>
      <p style="margin:0;">Signature: <span class="ol-fill">${signed ? `<span class="ol-sigtype">${olEsc(o.signer_name)}</span>` : '&nbsp;'}</span></p>
      ${signed ? `<div class="ol-e">✔ Accepted electronically by <strong>${olEsc(o.signer_name)}</strong> on ${olEsc(signedLabel)}, verified by a one-time code sent to ${olEsc(o.signer_phone_hint ? '+91 •••••' + o.signer_phone_hint : 'the candidate\'s WhatsApp')}. Reference ${olEsc(o.ref_no || '')}${o.letter_hash ? ' · document fingerprint ' + olEsc(String(o.letter_hash).slice(0, 16)) : ''}.</div>` : ''}
    </div>`);
  let page = olPageShell(true); mount.appendChild(page);
  let body = page.querySelector('.ol-body');
  blocks.forEach(html => {
    const tmp = document.createElement('div'); tmp.innerHTML = html; const el = tmp.firstElementChild;
    body.appendChild(el);
    if (body.scrollHeight > body.clientHeight + 1 && body.children.length > 1) {
      body.removeChild(el);
      // keep a heading with the paragraph after it
      const last = body.lastElementChild;
      const carry = last && last.tagName === 'H3' ? last : null;
      if (carry) body.removeChild(carry);
      page = olPageShell(false); mount.appendChild(page); body = page.querySelector('.ol-body');
      if (carry) body.appendChild(carry);
      body.appendChild(el);
    }
  });
  return mount.querySelectorAll('.ol-page');
}

function olLoadScript(src, globalName) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  return new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = src; s.onload = () => window[globalName] ? resolve(window[globalName]) : reject(new Error('not loaded')); s.onerror = () => reject(new Error('Could not load ' + src)); document.head.appendChild(s); });
}

// Render the letter off-screen and save it as an A4 PDF
async function olDownloadPdf(o, filename) {
  const holder = document.createElement('div');
  holder.style.cssText = 'position:absolute; left:0; top:0; z-index:-1; width:794px;';
  document.body.appendChild(holder);
  try {
    olBuildPages(o, holder);
    await new Promise(r => setTimeout(r, 150));
    const lib = await olLoadScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js', 'html2pdf');
    const pages = [...holder.querySelectorAll('.ol-page')];
    let worker = lib().set({ margin: 0, filename, image: { type: 'jpeg', quality: 0.95 }, html2canvas: { scale: 2, scrollX: 0, scrollY: 0, backgroundColor: '#fdfbf6' }, jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait', hotfixes: ['px_scaling'] } }).from(pages[0]).toPdf();
    for (let i = 1; i < pages.length; i++) {
      worker = worker.get('pdf').then(pdf => { pdf.addPage([794, 1123], 'portrait'); }).from(pages[i]).toContainer().toCanvas().toPdf();
    }
    await worker.save();
  } finally { holder.remove(); }
}

function layoutPages() {
  document.querySelectorAll('.pagewrap').forEach(w => {
    const p = w.querySelector('.ol-page'); if (!p) return;
    const s = Math.min(1, w.clientWidth / 794);
    p.style.transform = `scale(${s})`;
    w.style.height = (1123 * s) + 'px';
  });
}
window.addEventListener('resize', layoutPages);

function syncUi() {
  const read = document.getElementById('readChk').checked;
  const name = document.getElementById('signerName').value.trim();
  document.getElementById('signerName').disabled = otpSent;
  document.getElementById('sendBtn').disabled = busy || !read || name.length < 3;
  document.getElementById('sendBtn').style.display = otpSent ? 'none' : '';
  document.getElementById('otpBox').style.display = otpSent ? '' : 'none';
  document.getElementById('signBtn').style.display = otpSent ? '' : 'none';
  document.getElementById('resendRow').style.display = otpSent ? '' : 'none';
  const otp = (document.getElementById('otp') || {}).value || '';
  document.getElementById('signBtn').disabled = busy || !read || otp.length !== 6;
}

async function sendOtp() {
  const err = document.getElementById('err'); err.textContent = '';
  busy = true; syncUi();
  const { data, error } = await sb.rpc('offer_letter_send_otp', { p_token: token });
  busy = false;
  if (error) { err.textContent = errMsg(error); syncUi(); return; }
  otpSent = true; syncUi();
  setTimeout(() => { const i = document.getElementById('otp'); if (i) i.focus(); }, 50);
}

async function sign() {
  const err = document.getElementById('err'); err.textContent = '';
  busy = true; syncUi();
  const { data, error } = await sb.rpc('offer_letter_sign', { p_token: token, p_otp: document.getElementById('otp').value, p_name: document.getElementById('signerName').value });
  busy = false;
  if (error) { err.textContent = errMsg(error); syncUi(); return; }
  if (data && data.ok === false) { err.textContent = data.error || 'Incorrect code.'; syncUi(); return; }
  await load();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function downloadPdf(btn) {
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Preparing PDF…';
  try { await olDownloadPdf(offer, 'WAIN-Offer-Letter-' + String(offer.candidate_name || '').replace(/[^\w]+/g, '-') + '.pdf'); }
  catch (e) { alert('Could not create the PDF: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = label; }
}
